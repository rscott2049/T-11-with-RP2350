; Run a program with simh
set cpu 11/03
set cpu 64k
set cpu NOMMU
set cpu NOFIS
set cpu NOEIS
set cpu NOFPP
set cpu 56K
set cpu noidle
set throttle 10%

set dz disable
set hk disable
set tm disable

set rl enable
set rl0 RL02
;att rl0 rt11v507_rl.dsk
att rl0 rt11v507_working_rl.dsk

set debug boot_sim_dbg.txt
;set rl debug=hack
set rl debug=hack_rd;hack_wr

;set rk enable
;att rk0 rt11v400c_work.dsk
;att rk1 rt11v400c_src.dsk
;att rk2 rt11v400c_tmp.dsk
;att rk3 rt11v400c_orig.dsk
;att rk4 rt11v507.dsk

; Break on write to TX buffer
;set br -w 0177566 ; exit

;deposit pc      017773000 
set ROM ENABLE
set ROM0 ADDRESS=017765000
set ROM1 ADDRESS=017773200
set ROM2 ADDRESS=017773400
attach ROM0 23-248F1_mod.bic
attach ROM1 23-756A9.bic
attach ROM2 23-751A9.bic

; Entry point of m9312 ROM, without diags
;deposit pc 01765114
;go
;deposit pc 017765114

;oad -r -b your_rom_file.bin 165114
;sim> examine 165114